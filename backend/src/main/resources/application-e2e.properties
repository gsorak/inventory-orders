# Profile used only by start-e2e.sh for the Playwright E2E tests: a separate port and the throwaway database from
# compose.yaml (service postgres-e2e), so E2E data never lands in the development database. The literal values
# deliberately ignore DB_URL, DB_USERNAME and DB_PASSWORD from .env.
server.port=8090
spring.datasource.url=jdbc:postgresql://localhost:5434/inventory_e2e
spring.datasource.username=e2e
spring.datasource.password=e2e
