spring.application.name=inventory-orders-demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/inventory}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Bounds how long a transaction waits for a row lock; a timeout is answered with 409 LOCK_CONFLICT.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '10s'

# Flyway owns the schema (db/migration, including all CHECK constraints); Hibernate only validates it.
# Migrations run at startup; concurrent tasks serialise on Flyway's PostgreSQL lock. Clean must never run.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true

# Only the health endpoint is exposed, without details. The load balancer checks /actuator/health/readiness;
# the deployed listener forwards only /api/*, so /actuator is not reachable from outside the VPC.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Development-only: allow the Expo web dev server (localhost:8081) and the production build served for the Playwright
# E2E tests (localhost:8082) to call the API. Empty disables CORS.
app.cors.allowed-origins=http://localhost:8081,http://localhost:8082

# How long a checkout holds stock, and how often expired reservations are swept to release their stock.
inventory.reservation.ttl=PT15M
inventory.reservation.expiry-sweep-interval=PT30S
inventory.scheduling.enabled=true

# Public demo: products can only be created from DemoProductCatalog. Enabled by the demo profile.
app.demo.enabled=false
